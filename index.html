<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario - Skin Tester & Showcase</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #f8d800; margin-bottom: 5px; text-shadow: 2px 2px #d80000; text-align: center; }
        p { color: #aaa; margin-top: 0; font-size: 14px; text-align: center; }

        .preview-container {
            position: relative;
            background: #5c94fc;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            margin: 15px 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .controls-panel {
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .control-group label {
            font-weight: bold;
            color: #f8d800;
            font-size: 14px;
        }

        select, button, input[type="range"] {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 6px 12px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        button:active {
            background: #e40058;
            transform: translateY(1px);
        }

        .btn-action {
            background: #008800;
            border-color: #55ff55;
        }

        .touch-pad {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-touch {
            width: 70px;
            height: 50px;
            font-size: 18px;
            background: #f8d800;
            color: #000;
            border-color: #000;
        }
    </style>
</head>
<body>

    <h1>🧪 PHÒNG THỬ SKIN HD</h1>
    <p>Kiểm tra hoạt họa, màu sắc và chi tiết pixel của các bộ trang phục</p>

    <!-- KHUNG HÌNH THỬ SKIN -->
    <div class="preview-container">
        <canvas id="previewCanvas" width="400" height="240"></canvas>
    </div>

    <!-- BẢNG ĐIỀU KHIỂN & TÙY CHỈNH -->
    <div class="controls-panel">
        
        <!-- 1. CHỌN SKIN -->
        <div class="control-group">
            <label for="skinSelect">🎭 Chọn Skin:</label>
            <select id="skinSelect" onchange="changeSkin(this.value)">
                <option value="default">🔴 Mario Đỏ Mặc Định</option>
                <option value="minion">🟡 Minion HD Pixel</option>
                <option value="amongus">🔴 Among Us Red HD</option>
                <option value="senku">🧪 Senku (Dr. Stone) HD</option>
                <option value="zombie">🧟 Zombie (PvZ) HD</option>
                <option value="jotaro">🌌 Jotaro Kujo (JoJo) HD</option>
            </select>
        </div>

        <!-- 2. THAY ĐỔI TRẠNG THÁI -->
        <div class="control-group">
            <label>⚡ Trạng Thái Kích Thước:</label>
            <div>
                <button onclick="setPowerState('small')">Nhỏ (Small)</button>
                <button onclick="setPowerState('super')">To (Super)</button>
            </div>
        </div>

        <!-- 3. BẬT/TẮT HIỆU ỨNG NGÔI SAO -->
        <div class="control-group">
            <label>🌟 Hiệu Ứng Bất Tử (Starman):</label>
            <button id="starBtn" class="btn-action" onclick="toggleStarMode()">Bật Sao Lấp Lánh</button>
        </div>

        <!-- 4. THAY ĐỔI PHÓNG TO (ZOOM) -->
        <div class="control-group">
            <label for="zoomRange">🔍 Độ Phóng To Chi Tiết:</label>
            <input type="range" id="zoomRange" min="1" max="3" step="0.5" value="1.5" oninput="updateZoom(this.value)">
            <span id="zoomVal" style="font-weight:bold;">1.5x</span>
        </div>

        <!-- 5. PHÍM ĐIỀU KHIỂN HÀNH ĐỘNG -->
        <div class="control-group" style="border-bottom:none;">
            <label>🎮 Thử Động Tác Cảm Ứng / Bàn Phím (A, D, Space):</label>
        </div>
        <div class="touch-pad">
            <button class="btn-touch" onmousedown="keys.left=true" onmouseup="keys.left=false" ontouchstart="keys.left=true" ontouchend="keys.left=false">◄</button>
            <button class="btn-touch" style="background:#e75910; color:#fff;" onclick="doJump()">NHẢY</button>
            <button class="btn-touch" onmousedown="keys.right=true" onmouseup="keys.right=false" ontouchstart="keys.right=true" ontouchend="keys.right=false">►</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById("previewCanvas");
        const ctx = canvas.getContext("2d");

        // Thông số thử nghiệm skin
        let currentSkin = 'default';
        let powerState = 'small'; // 'small' hoặc 'super'
        let isStarMode = false;
        let zoomScale = 1.5;

        let char = {
            x: 188,
            y: 144,
            w: 24,
            h: 36,
            dx: 0,
            dy: 0,
            facing: 'right',
            isGrounded: true
        };

        let keys = { left: false, right: false };

        function changeSkin(skin) {
            currentSkin = skin;
        }

        function setPowerState(state) {
            powerState = state;
            if (state === 'small') {
                char.h = 36;
            } else {
                char.h = 48;
            }
            if (char.isGrounded) {
                char.y = 180 - char.h;
            }
        }

        function toggleStarMode() {
            isStarMode = !isStarMode;
            document.getElementById("starBtn").innerText = isStarMode ? "Tắt Sao" : "Bật Sao Lấp Lánh";
            document.getElementById("starBtn").style.background = isStarMode ? "#d80000" : "#008800";
        }

        function updateZoom(val) {
            zoomScale = parseFloat(val);
            document.getElementById("zoomVal").innerText = val + "x";
        }

        function doJump() {
            if (char.isGrounded) {
                char.dy = -10;
                char.isGrounded = false;
            }
        }

        // VẼ TẤT CẢ CÁC SKIN HD CHI TIẾT
        function drawCustomSkin(skinId, mx, my, mw, mh, facing) {
            ctx.save();

            // Nếu bật Sao Bất Tử: Tạo hiệu ứng lấp lánh màu sắc
            if (isStarMode && Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.filter = `hue-rotate(${Math.floor(Math.random() * 360)}deg) brightness(1.3)`;
            }

            if (skinId === 'minion') {
                ctx.fillStyle = "#f8d800";
                ctx.fillRect(mx + 2, my, 20, 26);
                ctx.fillStyle = "#d4b800";
                ctx.fillRect(facing === 'right' ? mx + 18 : mx + 2, my + 2, 4, 24);
                ctx.fillStyle = "#222";
                ctx.fillRect(mx + 1, my + 6, 22, 4);
                ctx.fillStyle = "#ccc";
                ctx.fillRect(mx + 6, my + 3, 12, 10);
                ctx.fillStyle = "#fff";
                ctx.fillRect(mx + 8, my + 5, 8, 6);
                ctx.fillStyle = "#000";
                ctx.fillRect(mx + (facing === 'right' ? 12 : 9), my + 7, 3, 3);
                ctx.fillStyle = "#0058f8";
                ctx.fillRect(mx + 3, my + 18, 18, 14);
                ctx.fillStyle = "#0038b8";
                ctx.fillRect(mx + 3, my + 26, 18, 6);
                ctx.fillStyle = "#000";
                ctx.fillRect(mx + 3, my + 32, 7, 4);
                ctx.fillRect(mx + 14, my + 32, 7, 4);
            } else if (skinId === 'amongus') {
                ctx.fillStyle = "#d80000";
                ctx.fillRect(mx + 2, my + 3, 20, 25);
                ctx.fillStyle = "#a00000";
                ctx.fillRect(facing === 'right' ? mx + 2 : mx + 16, my + 5, 6, 23);
                ctx.fillStyle = "#d80000";
                ctx.fillRect(facing === 'right' ? mx - 2 : mx + 18, my + 8, 8, 14);
                ctx.fillStyle = "#555";
                let visorX = facing === 'right' ? mx + 10 : mx + 2;
                ctx.fillRect(visorX, my + 7, 11, 9);
                ctx.fillStyle = "#88ccff";
                ctx.fillRect(visorX + 2, my + 8, 8, 6);
                ctx.fillStyle = "#fff";
                ctx.fillRect(visorX + 3, my + 9, 3, 2);
                ctx.fillStyle = "#a00000";
                ctx.fillRect(mx + 3, my + 28, 6, 8);
                ctx.fillRect(mx + 15, my + 28, 6, 8);
            } else if (skinId === 'senku') {
                ctx.fillStyle = "#00ffaa";
                ctx.fillRect(mx, my - 8, 24, 14);
                ctx.fillStyle = "#00aa66";
                ctx.fillRect(mx + 4, my - 12, 16, 6);
                ctx.fillStyle = "#fc9838";
                ctx.fillRect(mx + 4, my + 6, 16, 10);
                ctx.fillStyle = "#d80000";
                ctx.fillRect(mx + (facing === 'right' ? 13 : 6), my + 8, 3, 5);
                ctx.fillStyle = "#f8f8d8";
                ctx.fillRect(mx + 3, my + 16, 18, 14);
                ctx.fillStyle = "#68381c";
                ctx.fillRect(mx + 3, my + 22, 18, 3);
            } else if (skinId === 'zombie') {
                ctx.fillStyle = "#609050";
                ctx.fillRect(mx + 2, my + 1, 20, 15);
                ctx.fillStyle = "#fff";
                ctx.fillRect(mx + 3, my + 4, 8, 8);
                ctx.fillRect(mx + 13, my + 5, 6, 6);
                ctx.fillStyle = "#000";
                ctx.fillRect(mx + 7, my + 7, 2, 2);
                ctx.fillRect(mx + 15, my + 7, 2, 2);
                ctx.fillStyle = "#553311";
                ctx.fillRect(mx + 2, my + 16, 20, 13);
                ctx.fillStyle = "#d80000";
                ctx.fillRect(mx + 10, my + 16, 3, 9);
                ctx.fillStyle = "#111155";
                ctx.fillRect(mx + 4, my + 29, 16, 7);
            } else if (skinId === 'jotaro') {
                ctx.fillStyle = "#0a152d";
                ctx.fillRect(mx + 1, my - 2, 22, 8);
                ctx.fillStyle = "#f8d800";
                ctx.fillRect(mx + 10, my, 4, 4);
                ctx.fillStyle = "#fc9838";
                ctx.fillRect(mx + 4, my + 6, 16, 8);
                ctx.fillStyle = "#d800d8";
                ctx.fillRect(mx + 8, my + 14, 8, 11);
                ctx.fillStyle = "#0a152d";
                ctx.fillRect(mx + 1, my + 14, 6, 18);
                ctx.fillRect(mx + 17, my + 14, 6, 18);
                ctx.fillStyle = "#f8d800";
                ctx.fillRect(mx + 4, my + 15, 3, 7);
            } else {
                ctx.fillStyle = "#e40058";
                ctx.fillRect(mx + 3, my, 18, 7);
                ctx.fillStyle = "#fc9838";
                ctx.fillRect(mx + 4, my + 7, 16, 9);
                ctx.fillStyle = "#000";
                ctx.fillRect(mx + (facing === 'right' ? 14 : 6), my + 9, 3, 3);
                ctx.fillStyle = "#68381c";
                ctx.fillRect(mx + (facing === 'right' ? 10 : 4), my + 12, 10, 3);
                ctx.fillStyle = "#e40058";
                ctx.fillRect(mx + 3, my + 16, 18, 9);
                ctx.fillStyle = "#0000d8";
                ctx.fillRect(mx + 4, my + 25, 16, mh - 25);
            }

            ctx.restore();
        }

        function update() {
            char.dx = 0;
            if (keys.left) { char.dx = -3; char.facing = 'left'; }
            if (keys.right) { char.dx = 3; char.facing = 'right'; }

            char.x += char.dx;
            if (char.x < 20) char.x = 20;
            if (char.x > canvas.width - 40) char.x = canvas.width - 40;

            // Vật lý trọng lực
            char.dy += 0.5;
            char.y += char.dy;

            if (char.y + char.h >= 180) {
                char.y = 180 - char.h;
                char.dy = 0;
                char.isGrounded = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nền bầu trời
            ctx.fillStyle = "#5c94fc";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sàn gạch đất
            ctx.fillStyle = "#c84c0c";
            ctx.fillRect(0, 180, canvas.width, 60);
            ctx.fillStyle = "#00d800";
            ctx.fillRect(0, 180, canvas.width, 6);

            ctx.save();
            // Xử lý zoom trung tâm
            ctx.translate(canvas.width / 2, 180);
            ctx.scale(zoomScale, zoomScale);
            ctx.translate(-canvas.width / 2, -180);

            // Vẽ skin
            drawCustomSkin(currentSkin, char.x, char.y, char.w, char.h, char.facing);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Sự kiện phím bấm thử nghiệm
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
            if ((e.key === "ArrowUp" || e.key === " " || e.key === "w" || e.key === "W")) doJump();
        });

        window.addEventListener("keyup", e => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
        });

        loop();
    </script>
</body>
</html>
